<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse Blade Animator</title>
<style>
:root{--bg:#0d0e14;--panel:#161823;--panel2:#1d2030;--line:#2a2e44;--txt:#d9dcf0;--dim:#8a8fb0;--acc:#a46bff;--acc2:#45e4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.3 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:38px 1fr 250px;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{color:var(--acc);letter-spacing:.5px}
header .sp{flex:1}
#vista{position:relative;min-height:0;display:grid;grid-template-columns:1fr 230px}
#lienzo{position:relative;min-width:0;overflow:hidden}
#lienzo canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:8px;font:12px ui-monospace,monospace;color:#cfd3ff;text-shadow:0 1px 2px #000;pointer-events:none}
#props{background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto}
#props h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
#props .fila{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #22263a}
#props .fila span:last-child{color:#fff}
#curva{width:100%;height:150px;background:#11131c;border:1px solid var(--line);border-radius:4px;margin-top:8px}
#abajo{display:grid;grid-template-rows:36px 1fr;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#barra{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
button,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
label{display:flex;align-items:center;gap:4px;color:var(--dim)}
#cuadro{font:12px ui-monospace,monospace;min-width:92px;text-align:center;color:#fff}
#linea{position:relative;min-height:0;overflow:hidden}
#linea canvas{display:block;width:100%;height:100%;cursor:pointer}
#carga{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;color:var(--dim)}
@media (max-width:760px){#app{grid-template-rows:38px 1fr 230px}#vista{grid-template-columns:1fr}#props{display:none}header .opc{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header><b>◐ ECLIPSE BLADE</b><span class="opc" style="color:var(--dim)">Animator · VFX</span><span class="sp"></span>
    <label><input type="checkbox" id="vfx" checked>VFX</label>
    <label><input type="checkbox" id="bloom" checked>Bloom</label>
    <label><input type="checkbox" id="flash" checked>Flash/Shake</label>
  </header>
  <div id="vista">
    <div id="lienzo"><div id="hud"></div><div id="carga">cargando escena…</div></div>
    <aside id="props"><h3>Keyframe</h3><div id="info"><div class="fila"><span>Elegí un rombo</span><span></span></div></div><canvas id="curva" width="420" height="300"></canvas>
      <h3 style="margin-top:14px">Atajos</h3>
      <div class="fila"><span>Play / pausa</span><span>Espacio</span></div>
      <div class="fila"><span>Cuadro ±1</span><span>← →</span></div>
      <div class="fila"><span>Clave ±</span><span>, .</span></div>
      <div class="fila"><span>Cámara</span><span>C</span></div>
    </aside>
  </div>
  <div id="abajo">
    <div id="barra">
      <button id="ini" title="Inicio">⏮</button><button id="ant" title="Clave anterior">◆◀</button>
      <button id="play" class="on">❚❚</button>
      <button id="sig" title="Clave siguiente">▶◆</button><button id="fin" title="Final">⏭</button>
      <span id="cuadro">0 / 360</span>
      <select id="vel"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <label><input type="checkbox" id="bucle" checked>Bucle</label>
      <button id="cam" class="on">🎥 Cámara render</button>
    </div>
    <div id="linea"><canvas id="tl"></canvas></div>
  </div>
</div>
<script id="datos" type="application/json">__CLAVES__</script>
<script id="lentes" type="application/json">__LENS__</script>
<script id="glb" type="text/plain">__GLB__</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const D = JSON.parse(document.getElementById('datos').textContent);
const LENS = JSON.parse(document.getElementById('lentes').textContent);
const FPS = D.fps, END = D.end;
const $ = id => document.getElementById(id);

// ---------- render ----------
const caja = $('lienzo');
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.1;
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
caja.prepend(ren.domElement);
const esc = new THREE.Scene();
esc.background = new THREE.Color(0x0b0f24); esc.fog = new THREE.Fog(0x0b0f24, 30, 80);
const libre = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 300);
libre.position.set(9, 6, -2);
const orb = new OrbitControls(libre, ren.domElement); orb.enableDamping = true; orb.target.set(0, 2.5, 4);
let camRender = null;
const comp = new EffectComposer(ren);
const pasoRender = new RenderPass(esc, libre); comp.addPass(pasoRender);
const bloom = new UnrealBloomPass(new THREE.Vector2(800, 450), 0.7, 0.5, 0.9); comp.addPass(bloom);
comp.addPass(new OutputPass());

// baseplate con studs y pilares de fondo
const tex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#4e5056'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#62646a'; g.beginPath(); g.arc(64, 64, 35, 0, 7); g.fill();
  g.fillStyle = '#72747a'; g.beginPath(); g.arc(64, 62, 30, 0, 7); g.fill();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; })();
const piso = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; esc.add(piso);
let semilla = 7; const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 16; i++) {
  const a = rnd() * 6.283, r = 18 + rnd() * 16, h = 4 + rnd() * 10, w = 2 + Math.floor(rnd() * 3), d = 2 + Math.floor(rnd() * 3);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: ['#3a3f55', '#2c3048', '#4b3a5a', '#2e4552'][i % 4], roughness: .8 }));
  m.position.set(Math.cos(a) * r, h / 2, -(Math.sin(a) * r - 6)); esc.add(m);
}
// luces: luna + tres de contorno (cian, violeta, cálida)
esc.add(new THREE.HemisphereLight(0x4a5590, 0x14182a, 0.9));
const luna = new THREE.DirectionalLight(0x9fb4ff, 1.6); luna.position.set(-8, 14, 8); luna.castShadow = true;
luna.shadow.mapSize.set(2048, 2048); Object.assign(luna.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, far: 60 }); luna.target.position.set(0, 0, 6);
esc.add(luna, luna.target);
for (const [c, p, i] of [[0x45e4ff, [6, 6, -4], 35], [0xb05bff, [-7, 5, 2], 35], [0xffd9a8, [2, 7, 12], 25]]) {
  const l = new THREE.PointLight(c, i, 30, 1.6); l.position.set(...p); esc.add(l);
}
const brillo = new THREE.PointLight(0x66e6ff, 10, 10, 1.6);

// ---------- escena del GLB ----------
const b64 = document.getElementById('glb').textContent.trim();
const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
const FADE = [];        // [vacío fade__X, materiales de X]
let mixer, espada, filo = [];
const VIOL = /corte2|giro1|ola1|golpe2|aura|energia/;
function vfxMat(nombre, mesh, src) {
  const grad = /corte|giro|ola/.test(nombre);
  const col = src.emissive ? src.emissive.clone() : new THREE.Color(1, 1, 1);
  const k = /_b$|ola2|pared|chispa/.test(nombre) ? 2.5 : 1.8;
  return new THREE.ShaderMaterial({
    uniforms: { col: { value: col.multiplyScalar(k) }, fade: { value: /chispa|energia/.test(nombre) ? 1 : 0 }, grad: { value: grad ? 1 : 0 } },
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 col;uniform float fade,grad;varying vec2 vUv;void main(){float a=fade;if(grad>.5)a*=pow(vUv.x,1.6)*sin(vUv.y*3.14159);gl_FragColor=vec4(col*a,a);}',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
}
new GLTFLoader().parse(buf, '', g => {
  const raiz = g.scene; esc.add(raiz);
  const porNombre = {};
  raiz.traverse(o => {
    if (o.isMesh) {
      const n = o.name.replace(/_\d+$/, '');
      if (/^m_/.test(o.material.name)) { o.material = vfxMat(o.material.name.slice(2).replace(/b$/, '_b'), o, o.material); o.userData.vfx = 1; o.castShadow = false; }
      else { o.castShadow = true; o.receiveShadow = true; }
      if (o.material.name === 'filo') filo.push(o.material);
    }
    if (o.isCamera) camRender = o;
    porNombre[o.name] = o;
  });
  // material compartido de los efectos con el mismo nombre
  for (const nm in porNombre) if (nm.startsWith('fade__')) {
    const obj = porNombre[nm.slice(6)]; const mats = new Set();
    if (obj) obj.traverse(o => { if (o.isMesh) mats.add(o.material); });
    if (nm === 'fade__aura0') raiz.traverse(o => { if (o.isMesh && /^aura/.test(o.name)) mats.add(o.material); });
    FADE.push([porNombre[nm], [...mats]]);
  }
  espada = porNombre['Sword']; if (espada) { brillo.position.set(0, 2.4, 0); espada.add(brillo); }
  mixer = new THREE.AnimationMixer(raiz);
  for (const c of g.animations) { const a = mixer.clipAction(c); a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; a.play(); }
  if (camRender) { camRender.parent.updateMatrixWorld(); pasoRender.camera = camRender; }
  $('carga').remove(); tamano(); armarPistas();
});

// intensidad del filo (la misma tabla que en Blender)
const EG = [[0, 4], [66, 6], [72, 40], [86, 10], [96, 22], [104, 10], [114, 22], [130, 10], [200, 30], [210, 10], [276, 70], [294, 120], [312, 14], [360, 8]];
function egAt(f) { for (let i = 0; i < EG.length - 1; i++) { const [a, va] = EG[i], [b, vb] = EG[i + 1]; if (f <= b) { const t = (f - a) / (b - a), s = t * t * (3 - 2 * t); return va + (vb - va) * s; } } return 8; }
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };

// ---------- estado ----------
let t = 0, jugando = true, usarRender = true;
function ponerCuadro(f) { t = Math.max(0, Math.min(END, f)) / FPS; }
function aplicar() {
  const f = t * FPS;
  if (!mixer) return;
  for (const a of mixer._actions) { a.enabled = true; a.paused = false; a.time = Math.min(t, a._clip.duration); }
  mixer.update(0);
  const vfxOn = $('vfx').checked;
  for (const [e, mats] of FADE) for (const m of mats) if (m.uniforms) m.uniforms.fade.value = Math.max(0, Math.min(1, e.position.x));
  esc.traverse(o => { if (o.userData.vfx) o.visible = vfxOn; });
  const eg = egAt(f);
  for (const m of filo) m.emissiveIntensity = eg / 10;
  brillo.intensity = eg * 0.35;
  bloom.enabled = $('bloom').checked;
  // cámara render: lente de Blender + shake
  if (camRender) {
    const fi = Math.round(f), lens = LENS[Math.min(END, fi)] || 35;
    camRender.aspect = asp; camRender.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(Math.atan(18 / lens)) / asp)); camRender.updateProjectionMatrix();
    if ($('flash').checked) {
      let k = 0; for (const [f0, amp] of D.shake) if (fi - f0 >= 0 && fi - f0 < 10) k += amp * (1 - (fi - f0) / 10);
      if (fi >= 206 && fi < 288) k += 0.012 * (fi - 206) / 82;
      camRender.position.x += hash(fi) * k; camRender.position.y += hash(fi + .3) * k; camRender.position.z += hash(fi + .7) * k;
    }
  }
  const fl = $('flash').checked && D.flash.includes(Math.round(f));
  ren.domElement.style.filter = fl ? 'invert(1) saturate(1.6)' : '';
  $('cuadro').textContent = Math.round(f) + ' / ' + END;
  $('hud').textContent = (t).toFixed(2) + ' s · ' + (usarRender ? 'cámara render' : 'cámara libre (arrastrá)');
}

// ---------- tamaño ----------
let asp = 16 / 9;
function tamano() {
  const w = caja.clientWidth, h = caja.clientHeight; asp = w / h;
  ren.setSize(w, h, false); comp.setSize(w, h); libre.aspect = asp; libre.updateProjectionMatrix();
  dibujarLinea();
}
addEventListener('resize', tamano);

// ---------- línea de tiempo (tipo Eclipse Animator) ----------
const PISTAS = [...new Set(D.keys.map(k => k.t))];
const COL = { SINE: '#45e4ff', CUBIC: '#6aa8ff', EXPO: '#ff6a8a', BACK: '#ffb84a', ELASTIC: '#7dff8a', CONSTANT: '#9a9a9a', BEZIER: '#c9a6ff', LINEAR: '#ffffff' };
const ESTILO = { SINE: 'Sine', CUBIC: 'Cubic', EXPO: 'Exponential', BACK: 'Back', ELASTIC: 'Elastic', CONSTANT: 'Constant', BEZIER: 'Cubic (Bezier)', LINEAR: 'Linear' };
const DIR = { EASE_IN: 'In', EASE_OUT: 'Out', EASE_IN_OUT: 'InOut', AUTO: 'Out' };
const tl = $('tl'), g2 = tl.getContext('2d');
const IZQ = 104, FILA = 17, ARR = 20;
let sel = null, claves = [];
function armarPistas() {
  claves = D.keys.map(k => ({ ...k, fila: PISTAS.indexOf(k.t) }));
  dibujarLinea();
}
const xDe = f => IZQ + (f / END) * (tl.width / devicePixelRatio - IZQ - 10);
function dibujarLinea() {
  const W = tl.parentElement.clientWidth, H = tl.parentElement.clientHeight;
  if (tl.width !== W * devicePixelRatio || tl.height !== H * devicePixelRatio) { tl.width = W * devicePixelRatio; tl.height = H * devicePixelRatio; }
  g2.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  g2.fillStyle = '#12141d'; g2.fillRect(0, 0, W, H);
  // regla
  g2.fillStyle = '#1b1e2c'; g2.fillRect(0, 0, W, ARR);
  g2.font = '10px ui-monospace,monospace'; g2.textBaseline = 'middle';
  for (let f = 0; f <= END; f += 6) {
    const x = xDe(f); g2.fillStyle = f % 24 === 0 ? '#3a3f5c' : '#23263a'; g2.fillRect(x, ARR, 1, H);
    if (f % 24 === 0) { g2.fillStyle = '#8a8fb0'; g2.fillText((f / 24) + 's', x + 2, 10); }
  }
  const filas = [...PISTAS, 'VFX', 'Flash'];
  filas.forEach((p, i) => {
    const y = ARR + i * FILA;
    g2.fillStyle = i % 2 ? '#151824' : '#181b28'; g2.fillRect(0, y, IZQ, FILA);
    g2.fillStyle = p === 'VFX' || p === 'Flash' ? '#a46bff' : '#cfd3ef'; g2.fillText(p, 8, y + FILA / 2);
    g2.fillStyle = '#20243433'; g2.fillRect(IZQ, y + FILA - 1, W, 1);
  });
  for (const k of claves) {
    const x = xDe(k.f), y = ARR + k.fila * FILA + FILA / 2, s = sel === k ? 6 : 4.5;
    g2.fillStyle = COL[k.ip] || '#fff'; g2.beginPath(); g2.moveTo(x, y - s); g2.lineTo(x + s, y); g2.lineTo(x, y + s); g2.lineTo(x - s, y); g2.fill();
    if (sel === k) { g2.strokeStyle = '#fff'; g2.stroke(); }
  }
  const yv = ARR + PISTAS.length * FILA;
  for (const e of D.vfx) { const x = xDe(e.f); g2.fillStyle = '#a46bff'; g2.fillRect(x - 1, yv + 3, 3, FILA - 6); }
  for (const f of D.flash) { const x = xDe(f); g2.fillStyle = '#fff'; g2.fillRect(x - 1, yv + FILA + 3, 3, FILA - 6); }
  for (const [f] of D.shake) { const x = xDe(f); g2.fillStyle = '#ff6a8a'; g2.fillRect(x - 1, yv + FILA + 9, 3, 5); }
  // cabezal
  const x = xDe(t * FPS); g2.fillStyle = '#ff4d6d'; g2.fillRect(x - 1, 0, 2, H);
  g2.beginPath(); g2.moveTo(x - 6, 0); g2.lineTo(x + 6, 0); g2.lineTo(x, 9); g2.fill();
  // leyenda de easings
  let lx = IZQ + 6; const ly = H - 10;
  if (H > ARR + (filas.length + 1) * FILA) for (const k in COL) { g2.fillStyle = COL[k]; g2.fillRect(lx, ly - 4, 8, 8); g2.fillStyle = '#8a8fb0'; g2.fillText(ESTILO[k], lx + 11, ly); lx += g2.measureText(ESTILO[k]).width + 26; }
}
let arrastrando = false;
function enLinea(ev) {
  const r = tl.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (x < IZQ) return;
  const fila = Math.floor((y - ARR) / FILA);
  const hit = claves.find(k => k.fila === fila && Math.abs(xDe(k.f) - x) < 6);
  if (hit && !arrastrando) { elegir(hit); ponerCuadro(hit.f); }
  else { const f = Math.round((x - IZQ) / (r.width - IZQ - 10) * END); ponerCuadro(f); }
  jugando = false; $('play').textContent = '▶'; $('play').classList.remove('on');
}
tl.addEventListener('pointerdown', e => { enLinea(e); arrastrando = true; tl.setPointerCapture(e.pointerId); });
tl.addEventListener('pointermove', e => { if (arrastrando) enLinea(e); });
tl.addEventListener('pointerup', () => arrastrando = false);

// ---------- panel del keyframe + curva de easing ----------
const EASE = {
  SINE: x => 1 - Math.cos(x * Math.PI / 2), CUBIC: x => x * x * x, EXPO: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  BACK: x => 2.70158 * x * x * x - 1.70158 * x * x, ELASTIC: x => x === 0 || x === 1 ? x : -Math.pow(2, 10 * x - 10) * Math.sin((x * 10 - 10.75) * 2 * Math.PI / 3),
  CONSTANT: x => x < 1 ? 0 : 1, BEZIER: x => x * x * (3 - 2 * x), LINEAR: x => x
};
function curva(ip, e) {
  const fIn = EASE[ip] || EASE.LINEAR;
  if (ip === 'BEZIER' || ip === 'CONSTANT' || ip === 'LINEAR') return fIn;
  if (e === 'EASE_IN') return fIn;
  if (e === 'EASE_IN_OUT') return x => x < .5 ? fIn(2 * x) / 2 : 1 - fIn(2 - 2 * x) / 2;
  return x => 1 - fIn(1 - x);
}
function elegir(k) {
  sel = k;
  const sig = claves.filter(c => c.t === k.t && c.f > k.f).sort((a, b) => a.f - b.f)[0];
  $('info').innerHTML = [['Pista', k.t], ['Cuadro', k.f], ['Tiempo', (k.f / FPS).toFixed(3) + ' s'], ['EasingStyle', ESTILO[k.ip] || k.ip], ['EasingDirection', DIR[k.e] || k.e], ['Hasta', sig ? sig.f + ' (' + (sig.f - k.f) + ' cuadros)' : '—']]
    .map(([a, b]) => `<div class="fila"><span>${a}</span><span>${b}</span></div>`).join('');
  const c = $('curva'), g = c.getContext('2d'), W = c.width, H = c.height, P = 30;
  g.fillStyle = '#11131c'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#262a3e'; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(P + i * (W - 2 * P) / 4, P); g.lineTo(P + i * (W - 2 * P) / 4, H - P); g.moveTo(P, P + i * (H - 2 * P) / 4); g.lineTo(W - P, P + i * (H - 2 * P) / 4); g.stroke(); }
  const fn = curva(k.ip, k.e); g.strokeStyle = COL[k.ip] || '#fff'; g.lineWidth = 3; g.beginPath();
  for (let i = 0; i <= 100; i++) { const x = i / 100, y = fn(x); const px = P + x * (W - 2 * P), py = H - P - y * (H - 2 * P) * .8 - (H - 2 * P) * .1; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke(); g.lineWidth = 1; g.fillStyle = '#8a8fb0'; g.font = '18px system-ui'; g.fillText('Graph Editor · ' + (ESTILO[k.ip] || k.ip) + ' ' + (DIR[k.e] || ''), P, 22);
  dibujarLinea();
}

// ---------- controles ----------
const play = () => { jugando = !jugando; $('play').textContent = jugando ? '❚❚' : '▶'; $('play').classList.toggle('on', jugando); };
const saltar = d => { const f = Math.round(t * FPS); const fs = [...new Set(claves.map(k => k.f))].sort((a, b) => a - b);
  const n = d > 0 ? fs.find(x => x > f) : fs.reverse().find(x => x < f); if (n !== undefined) { ponerCuadro(n); const k = claves.find(c => c.f === n); if (k) elegir(k); } };
const cam = () => { usarRender = !usarRender; $('cam').classList.toggle('on', usarRender); $('cam').textContent = usarRender ? '🎥 Cámara render' : '🖱 Cámara libre';
  pasoRender.camera = usarRender && camRender ? camRender : libre; };
$('play').onclick = play; $('ini').onclick = () => ponerCuadro(0); $('fin').onclick = () => ponerCuadro(END);
$('ant').onclick = () => saltar(-1); $('sig').onclick = () => saltar(1); $('cam').onclick = cam;
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight') ponerCuadro(Math.round(t * FPS) + 1);
  else if (e.key === 'ArrowLeft') ponerCuadro(Math.round(t * FPS) - 1);
  else if (e.key === '.') saltar(1); else if (e.key === ',') saltar(-1);
  else if (e.key === 'c' || e.key === 'C') cam();
});

// ---------- bucle ----------
const reloj = new THREE.Clock();
window.__anim = { ir: f => { ponerCuadro(f); jugando = false; aplicar(); orb.update(); comp.render(); }, cam, esc, mixer: () => mixer };
ren.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.1);
  if (jugando) { t += dt * +$('vel').value; if (t > END / FPS) t = $('bucle').checked ? 0 : END / FPS; }
  aplicar(); orb.update(); comp.render(); dibujarLinea();
});
</script>
</body>
</html>
