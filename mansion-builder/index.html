<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3fa9f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MANSION BUILDER</title>
<style>
/*CSS*/
html,body{margin:0;height:100%;background:#3fa9f5;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:absolute;left:0;top:0;touch-action:none;outline:none}
#gl{background:#a8d4ee}
#carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(#3fa9f5,#9ad8ff);color:#ffd34a;font:400 44px Bungee,'Arial Black',Impact,sans-serif;line-height:1.05;text-shadow:0 5px 0 #7a3c0c;z-index:5}
#carga small{font:14px sans-serif;color:#fff;margin-top:24px;text-shadow:none;opacity:0;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="carga">MANSION<br>BUILDER<small id="aviso">If it does not load, open it with Chrome or Safari.</small></div>
<noscript><div style="position:absolute;inset:0;background:#1d3557;color:#fff;font:18px sans-serif;display:flex;align-items:center;justify-content:center">This game needs JavaScript.</div></noscript>
<script>setTimeout(function(){var a=document.getElementById('aviso');if(a)a.style.opacity=1},7000)</script>
<!--JS-->
</body>
</html>
